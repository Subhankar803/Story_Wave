version: '3.8'

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=Story Wave
      - DATABASE_URL=postgresql://storywave:storywave@db:5432/story_wave
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SECRET_KEY=${SECRET_KEY:-super_secret_jwt_key_story_wave_2026}
      - CORS_ORIGINS=["*"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: pgvector/pgvector:pg16
    environment:
      - POSTGRES_USER=storywave
      - POSTGRES_PASSWORD=storywave
      - POSTGRES_DB=story_wave
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storywave -d story_wave"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:

