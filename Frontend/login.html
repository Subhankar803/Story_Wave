<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Sign In — Story Wave</title>
  <meta name="description" content="Sign in to your Story Wave account to access your novel drafts, worldbuilding lore, and continuity audit tools." />
  <meta name="theme-color" content="#081326" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Login Stylesheet -->
  <link rel="stylesheet" href="login.css" />
</head>
<body>

  <!-- Top bar with Back to Home and Theme Toggle -->
  <header class="auth-top-bar">
    <a href="overview.html" class="back-link" title="Return to Overview">
      <!-- Arrow Left SVG -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="19" y1="12" x2="5" y2="12"></line>
        <polyline points="12 19 5 12 12 5"></polyline>
      </svg>
      <span>Back to Home</span>
    </a>

    <!-- Theme Toggle Button -->
    <button id="themeToggleBtn" class="theme-toggle-btn" aria-label="Toggle Theme" title="Toggle Theme">
      <!-- Sun Icon -->
      <svg id="themeSunIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
      <!-- Moon Icon -->
      <svg id="themeMoonIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
      </svg>
    </button>
  </header>

  <!-- Centered Login Card -->
  <main class="auth-wrapper">
    <div class="auth-card">
      <!-- Clickable Story Wave Logo -->
      <a href="overview.html" class="auth-brand" aria-label="Story Wave Home">
        <div class="brand-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"></path>
            <line x1="16" y1="8" x2="2" y2="22"></line>
            <line x1="17.5" y1="15" x2="9" y2="15"></line>
          </svg>
        </div>
        <span class="brand-title">STORY WAVE</span>
      </a>

      <!-- Headings -->
      <h1 class="auth-heading" id="authHeading">Welcome Back</h1>
      <p class="auth-subheading" id="authSubheading">Enter your email and password to access your story workspace.</p>

      <!-- Alert Notification -->
      <div id="loginAlertBox" class="alert-box alert-danger" role="alert" aria-live="polite"></div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>
        <!-- Email Input -->
        <div class="form-group">
          <label for="emailInput" class="form-label">Email Address</label>
          <div class="input-container">
            <span class="input-icon">
              <!-- Mail SVG -->
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
                <polyline points="22,6 12,13 2,6"></polyline>
              </svg>
            </span>
            <input type="email" id="emailInput" class="form-input" placeholder="writer@storywave.ai" autocomplete="email" required />
          </div>
        </div>

        <!-- Password Input -->
        <div class="form-group">
          <label for="passwordInput" class="form-label">Password</label>
          <div class="input-container">
            <span class="input-icon">
              <!-- Lock SVG -->
              <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input type="password" id="passwordInput" class="form-input" placeholder="Enter your password" autocomplete="current-password" required />
            <button type="button" id="togglePasswordBtn" class="password-toggle-btn" aria-label="Toggle password visibility" title="Show/Hide Password">
              <!-- Eye SVG -->
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
              <!-- Eye Off SVG -->
              <svg id="eyeOffIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Remember Me Checkbox & Quick Demo Fill -->
        <div class="form-row-split">
          <label class="checkbox-label">
            <input type="checkbox" id="rememberMeInput" class="checkbox-input" />
            <span>Remember me</span>
          </label>
          <button type="button" id="fillDemoCredentialsBtn" class="btn-text-link" title="Fill demo author account">
            Use Demo Login
          </button>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="loginSubmitBtn" class="btn-submit">
          <span>Sign In to Dashboard</span>
        </button>
      </form>

      <!-- Step 2: Two-Step Verification Form (Initially Hidden) -->
      <form id="otpForm" novalidate style="display: none;">
        <div style="text-align: center; margin-bottom: 20px;">
          <div class="otp-shield-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
              <polyline points="9 12 11 14 15 10"></polyline>
            </svg>
          </div>
          <div style="font-size: 0.85rem; color: var(--text-secondary); margin-top: 6px;">
            Security Checkpoint
          </div>
        </div>

        <div class="form-group">
          <label for="otpInput" class="form-label" style="text-align: center; display: block;">Enter 6-Digit Verification Code</label>
          <div class="input-container">
            <input
              type="text"
              id="otpInput"
              class="form-input otp-code-input"
              placeholder="123456"
              maxlength="6"
              inputmode="numeric"
              autocomplete="one-time-code"
              required
            />
          </div>
          <p class="form-helper" style="margin-top: 8px; font-size: 0.8rem; color: var(--text-muted); text-align: center;">
            Demo Verification Code: <strong id="fillDemoOtpBtn" style="color: var(--accent); letter-spacing: 0.05em; cursor: pointer; text-decoration: underline;" title="Click to fill 123456">123456</strong>
          </p>
        </div>

        <button type="submit" id="otpSubmitBtn" class="btn-submit">
          <span>Verify & Enter Studio</span>
        </button>

        <div style="text-align: center; margin-top: 14px;">
          <button type="button" id="backToLoginBtn" class="btn-text-link" style="color: var(--text-muted); font-size: 0.84rem; cursor: pointer; background: none; border: none;">
            ← Back to Sign In
          </button>
        </div>
      </form>

      <!-- Footer navigation inside card -->
      <div class="auth-card-footer">
        Don’t have an account? <a href="register.html">Register here</a>
      </div>

      <!-- Clickable Support Contact Links -->
      <div class="auth-contact-footer">
        <a href="mailto:support@storywave.ai" class="auth-contact-link" title="Email Support">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path>
            <polyline points="22,6 12,13 2,6"></polyline>
          </svg>
          <span>support@storywave.ai</span>
        </a>
        <span>•</span>
        <a href="tel:+18005550199" class="auth-contact-link" title="Call Support">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
          <span>+1 (800) 555-0199</span>
        </a>
      </div>

      <div class="auth-copyright">
        &copy; <span id="copyrightYear">2026</span> Story Wave. All rights reserved.
      </div>
    </div>
  </main>

  <!-- Connect Login Vanilla JavaScript -->
  <script src="login.js?v=7.0"></script>
</body>
</html>
